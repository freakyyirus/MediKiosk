<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fg" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Kiosk Screen -->
  <rect x="22" y="4" width="38" height="44" rx="5" fill="rgba(14,165,233,0.08)" stroke="#0568A6" stroke-width="2.5"/>
  <!-- Stand -->
  <line x1="42" y1="48" x2="42" y2="54" stroke="#0568A6" stroke-width="2" stroke-linecap="round"/>
  <line x1="36" y1="54" x2="48" y2="54" stroke="#0568A6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Medical Cross -->
  <rect x="38" y="14" width="6" height="18" rx="2" fill="#10B981"/>
  <rect x="35" y="20" width="12" height="6" rx="2" fill="#10B981"/>

  <!-- Signal Waves -->
  <path d="M 55 16 Q 59 20 55 24" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 58 12 Q 64 20 58 28" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.55"/>

  <!-- Patient: Head -->
  <circle cx="12" cy="22" r="6.5" fill="#0568A6"/>
  <!-- Patient: Body -->
  <path d="M 12 28.5 L 12 44 Q 12 46 10 48 L 6 54" stroke="#0568A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Patient: Back leg -->
  <path d="M 12 44 Q 14 48 18 54" stroke="#0568A6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Patient: Arm reaching to screen -->
  <path d="M 12 32 L 20 28 L 28 22" stroke="#0568A6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Touch glow -->
  <circle cx="29" cy="21" r="3" fill="#10B981" opacity="0.5"/>
  <circle cx="29" cy="21" r="5.5" fill="#10B981" opacity="0.18"/>

  <!-- Pulse line -->
  <path d="M 2 60 L 12 60 L 15 56 L 18 63 L 21 58 L 24 60 L 34 60" stroke="#10B981" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" fill="none" opacity="0.7"/>
</svg>