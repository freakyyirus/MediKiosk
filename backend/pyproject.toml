[project]
name = "medikiosk-backend"
version = "1.0.0"
description = "MediKiosk — AI-Powered Clinical History & Document Digitization Platform"
requires-python = ">=3.11"
dependencies = [
    # ---- Web Framework ----
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # ---- Database ----
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",

    # ---- Redis ----
    "redis[hiredis]>=5.0.0",

    # ---- Auth & Security ----
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "casbin>=1.35.0",

    # ---- Validation & Serialization ----
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # ---- AI / ML ----
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "scikit-learn>=1.5.0",
    "qrcode>=7.4.0",
    "Pillow>=10.3.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.0",

    # ---- Audio Processing ----
    "pydub>=0.25.0",
    "webrtcvad>=2.0.10",

    # ---- Object Storage ----
    "minio>=7.2.0",

    # ---- FHIR ----
    "fhir.resources>=7.1.0",

    # ---- Utilities ----
    "python-dateutil>=2.9.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
