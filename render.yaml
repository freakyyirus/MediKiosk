# Render blueprint — reproducible deploy of the MediKiosk FastAPI backend.
#
# Apply via: Render Dashboard → Blueprints → New Blueprint Instance → this repo.
# Or create a manual Web Service and use these same build/start commands.
#
# The failure "Could not read package.json: ENOENT ... /opt/render/project/src/package.json"
# happens when Render is told to run a NODE service from the repo ROOT. This is a
# Python/FastAPI backend (there is deliberately no root package.json). Create the
# service with:
#   * Runtime: Python 3 (or apply this Blueprint — render.yaml sets the runtime)
#   * Root Directory: backend
#   * Build Command: pip install -r requirements.txt
#   * Start Command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
#   * Health Check Path: /health
# The frontend is deployed separately (Vercel) and points /api at this backend.

services:
  - type: web
    name: medikiosk-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: medikiosk-documents
      - key: DATABASE_URL
        sync: false
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_ULCA_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ABDM_CLIENT_ID
        sync: false
      - key: ABDM_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLOUD_VISION_API_KEY
        sync: false
      - key: TESSERACT_CMD
        value: /usr/bin/tesseract
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json